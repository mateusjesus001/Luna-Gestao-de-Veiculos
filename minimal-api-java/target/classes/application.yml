server:
  port: 5000

spring:
  application:
    name: minimal-api-java
  datasource:
    url: jdbc:mysql://localhost:3306/minimal_api?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: mjdc23657890
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jackson:
    mapper:
      accept-case-insensitive-properties: true

jwt:
  secret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  issuer: "minimal-api-java"
  audience: "minimal-api-clients"
  expiration-ms: 604800000  # 7 dias

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: INFO
